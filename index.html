<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sgantt — スケジュール管理ツール</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 上部: 期間コントロールバー ＋ 操作ボタン群 ＋ 状態の凡例（CLAUDE.md 5.1） -->
<header class="header">
<div class="toolbar">
  <h1 class="toolbar__title">sgantt</h1>

  <!-- 期間コントロール（CLAUDE.md 5.2） -->
  <div class="toolbar__group">
    <label class="toolbar__label" for="rangeStart">開始</label>
    <input type="date" id="rangeStart">
    <label class="toolbar__label" for="rangeEnd">終了</label>
    <input type="date" id="rangeEnd">
    <button type="button" id="range7">7営業日</button>
    <button type="button" id="range30">30日</button>
  </div>

  <!-- 操作ボタン群のうち左側（CLAUDE.md 5.1） -->
  <div class="toolbar__group">
    <button type="button" id="openSettings">設定</button>
    <!-- 非表示にした案件を半透明で出すトグル（CLAUDE.md 5.4） -->
    <button type="button" id="toggleHidden" aria-pressed="false">非表示を表示</button>
  </div>

  <!-- 入出力は画面右端に寄せる（CLAUDE.md 5.1） -->
  <div class="toolbar__group toolbar__group--right">
    <button type="button" id="exportData">書き出し</button>
    <button type="button" id="importData">読み込み</button>
    <!-- 読み込み用のファイル選択。画面には出しません -->
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>

<!-- 状態カラーの凡例。中身は render.js が Store.STATUSES から作ります -->
<div class="legend" id="legend"></div>
</header>

<!-- 本体: 左に行ラベル列、右に日付グリッド（CLAUDE.md 5.1） -->
<main class="gantt" id="gantt"></main>

<!-- ES modulesは使わず、順番どおりに読み込みます（CLAUDE.md 2-3） -->
<script src="js/holidays.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/popup.js"></script>
<script src="js/app.js"></script>

</body>
</html>
